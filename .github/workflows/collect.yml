name: collect-and-resolve

# Hourly: record the first sighting of new Robinhood Chain pools.
# Every run also resolves pools that are >= 24h old (stores their outcome).
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: coroner-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect new pools
        run: python feeder/collect.py collect 10
      - name: Resolve 24h outcomes
        run: python feeder/collect.py resolve
      - name: Commit state
        run: |
          git config user.name "coroner-bot"
          git config user.email "coroner-bot@users.noreply.github.com"
          git add data/state.json data/shards
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
